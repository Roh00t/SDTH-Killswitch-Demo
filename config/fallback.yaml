# Killswitch — benchtop node configuration.
# Every tunable lives here. No magic numbers in code (CLAUDE.md coding standards).

node:
  id: "killswitch-01"
  tick_hz: 100          # State machine tick. Fast: it enforces every fail-safe.

camera:
  device_index: 0
  width: 1280
  height: 720
  target_fps: 60
  use_mjpg: true
  # Horizontal field of view, degrees. CALIBRATE THIS: point at a known angular
  # span and measure. It sets the pixel-to-degree gain for the whole control
  # loop, so an error here shows up as sluggish or oscillatory tracking.
  horizontal_fov_deg: 65.0

# FALLBACK PROFILE — stock COCO weights.
# Use when model/best.onnx is not detecting reliably. Same pipeline, same code,
# only the driver changes. Measured: bird 0.949 on image/myna.jpg vs
# "helicopter 0.295" from the custom export on the identical image.
# 63ms inference at 640 vs 218ms at 1024, so ~16fps instead of ~4.6fps.
detector:
  weights: "yolo11s.pt"          # auto-downloads on first run
  conf_threshold: 0.40
  iou_threshold: 0.50
  imgsz: 640
  # COCO classes. A quadcopter is most often called "airplane" or "kite" by
  # COCO; "bird" is the reliable stand-in for a moving aerial target. Run
  # tools.vision_probe against your actual demo target to see which fires.
  # COCO has no "drone" class. These four are the usable airborne proxies:
  #   bird(14) airplane(4) kite(33) frisbee(29)
  # frisbee is the best disc-shaped-airborne-object stand-in COCO offers.
  # Filtering stays NAME-based, never index-based: the detector validates names
  # against model.names and rejects unknowns at construction, so a re-export
  # that reorders classes cannot silently re-target the system.
  # Confirm what actually fires:
  #   python -m tools.vision_probe --config config/fallback.yaml
  target_classes: ["bird", "airplane", "kite", "frisbee"]
  device: null          # null = let ultralytics choose (cuda > mps > cpu)

targeting:
  # Normalised offset within the detected box.
  #   ( 0.00,  0.00) centre of mass
  #   (-0.35, -0.35) forward rotor hub
  #   ( 0.00,  0.40) slung payload
  offset_x: 0.0
  offset_y: 0.0
  # Below this box dimension the offset is inside box jitter, so the solver
  # reverts to centre-of-mass and says so.
  min_box_px: 40.0

control:
  proportional_gain: 0.6     # Under-damped above ~1.0 on SG90s.
  max_step_deg: 6.0          # Per tick, per axis. Firmware also rate-limits.
  deadband_px: 3.0           # Below this, do not command — SG90s just buzz.

prediction:
  smoothing: 0.4
  max_lead_px: 250.0
  # Seed only; replaced by live measurement within a few frames.
  initial_compute_latency_s: 0.060
  # Servo travel allowance. NOT measurable — SG90s have no position feedback.
  # Estimated, and labelled as estimated wherever it surfaces.
  mechanical_allowance_s: 0.060

engagement:
  hold_error_px: 15.0        # Error band for HOLD.
  hold_duration_s: 3.0       # Continuous. Resets on any excursion.
  track_loss_timeout_s: 1.0  # No target for this long -> back to SCAN.
  scan_timeout_s: 30.0       # No detection for this long -> IDLE.
  auth_timeout_s: 10.0       # No operator decision -> back to TRACK.
  # 1.8, NOT 2.0. The firmware's independent ceiling is MAX_BURN_MS = 2000, and
  # it starts its clock when it parses L1 while the host starts its own clock
  # after the serial write returns — so at 2.0 the firmware wins every nominal
  # burn and emits "E06 burn ceiling reached", logging a clean engagement as a
  # hardware safety trip. 200 ms of margin gives nominal completion back to the
  # host and keeps the firmware ceiling as a genuine backstop.
  burn_duration_s: 1.8

scan:
  pan_step_deg: 4.0
  tilt_step_deg: 8.0
  max_cycles: 2
  # Azimuth the gimbal faces at pan centre. Cues outside +/-90 of this are
  # rejected, not clamped.
  boresight_azimuth_deg: 0.0

actuator:
  # WINDOWS DEMO PROFILE: pinned to an explicit COM port on purpose.
  #
  # "auto" matches the USB-UART bridge by description and is the right default
  # on macOS, where /dev/cu.usbserial-<n> renumbers between plugs. On the
  # Windows demo box the trade runs the other way: the COM number is stable
  # across reboots, and a pinned port removes auto-detect from the critical
  # path entirely. helper/hardware/actuator.py now matches the CH343 family, so
  # "auto" works here too — this pin is belt-and-braces, not a workaround.
  #
  # CONFIRM THIS NUMBER BEFORE EVERY DEMO. It moves when the board is plugged
  # into a different physical USB socket:
  #     python -m tools.serial_probe --list
  # Use the port whose description names a CH343/CP210x bridge, NOT the one
  # reading "USB Serial Device" — that is the ESP32-S3's native USB-CDC, which
  # re-enumerates on every board reset and kills the host's serial handle.
  #
  # On macOS/Linux set this back to "auto" or to /dev/cu.usbserial-<n>.
  port: "COM3"
  baud: 921600
  stow_pan_deg: 90.0
  stow_tilt_deg: 90.0

c2:
  broker_host: "localhost"
  broker_port: 1883
  # Shared secret on operator auth. null disables token checking, which is
  # acceptable ONLY on an isolated demo network and must be stated as such.
  auth_token: "sdth-demo-token"

# Annotated video link to tools/operator_console.py. The node owns the camera,
# so the console cannot open it — two processes cannot share a USB device.
video:
  enabled: true
  fps: 15
  max_width: 640
  quality: 60
